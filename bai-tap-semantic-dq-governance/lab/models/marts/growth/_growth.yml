models:
  - name: fct_sessions
    description: "Grain: 1 dòng / phiên truy cập."
    agg_time_dimension: session_date 
    semantic_model: 
      enabled: true
      name: sessions
    columns:
      - name: session_id
        data_tests: [unique, not_null]
        entity: {type: primary, name: session}
      - name: customer_id
        entity: {type: foreign, name: customer}
      - name: utm_source
        entity: {type: foreign, name: marketing_channel}
      - name: device
        dimension: {type: categorical}
      - name: session_date
        granularity: day
        dimension: {type: time}
    metrics:
      - name: sessions   # tên metric
        type: simple     # loại metr
        agg: count       # phép tính
        expr: session_id # tính trên cột nào 
      

      - name: conversion_rate 
        label: Conversion rate (orders / sessions)
        type: ratio
        numerator: orders
        denominator: sessions



  - name: fct_ad_spend
    description: "Grain: 1 dòng / ngày × nguồn quảng cáo."
    agg_time_dimension: spend_date 
    semantic_model:
      enabled: true
      name: ad_spend
    columns:
      - name: ad_spend_id
        data_tests: [unique, not_null]
        entity: {type: primary, name: ad_spend_row}
      - name: utm_source
        entity: {type: foreign, name: marketing_channel}
      - name: spend_date
        granularity: day
        dimension: {type: time}
    metrics:
      - name: ad_spend
        label: Ad spend
        type: simple
        agg: sum 
        expr: spend

      - name: roas
        label: ROAS (revenue / ad spend)
        type: ratio
        numerator: revenue
        denominator: ad_spend
   


  - name: dim_marketing_channels
    description: "1 dòng / utm_source."
    semantic_model:
      enabled: true
      name: marketing_channels
    columns:
      - name: utm_source
        data_tests: [unique, not_null]
        entity: {type: primary, name: marketing_channel}
      - name: channel_name
        dimension: {type: categorical}
      - name: channel_group
        dimension: {type: categorical}

